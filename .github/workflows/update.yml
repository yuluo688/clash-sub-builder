name: Update Proxy Subscription

on:
  schedule:
    # 每 4 小时（UTC）
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-subscription
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Mihomo
        run: python scripts/download_mihomo.py -o bin

      - name: Build subscription
        run: python main.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Validate output
        run: |
          test -f output/all.yaml
          python - <<'PY'
          import yaml
          from pathlib import Path
          p = Path("output/all.yaml")
          data = yaml.safe_load(p.read_text(encoding="utf-8"))
          assert isinstance(data, dict), "root not mapping"
          for k in ("proxies", "proxy-groups", "rules", "mixed-port"):
              assert k in data, f"missing {k}"
          print("proxies:", len(data.get("proxies") or []))
          print("groups:", len(data.get("proxy-groups") or []))
          print("validation OK")
          PY

      - name: Show stats
        run: |
          if [ -f output/stats.json ]; then
            cat output/stats.json
          else
            echo "stats.json missing"
          fi

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/all.yaml output/stats.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update proxy subscription"
            git push
          fi